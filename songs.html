	jezza {

		}
		
	@keyframes mooving {
		0% {left:0px;}
		50% {left:80vw;}

		}
		
	@keyframes spinnin {
		0% {transform: rotate(0deg);}
		50% {transform:rotate(180deg);}
		100% {transform:rotate(360deg);}
		}
	
	div {
		max-width:30%;
		height: auto;
		content:url("hello.png");
		position: relative;
		animation: mooving 10s infinite;
		}
		
	div:hover {
		animation: mooving 10s infinite, spinnin 0.5s 1;
		}
	
</style>
