<!DOCTYPE html>
<html>
<head>
<style>
	body {
	  background-image:url("bg.png");
	  }

	h1 {
	  color: white;
	  text-align: center;
	  font-family: helvetica;
	  font-size: 10vw;
	  line-height:10px;
	  }

	p {
	  color: white;
	  font-family: helvetica;
	  font-size:calc(12px + 4vw);
	  }

	jezza {
		max-width:50%;
		height:auto;
		content:url("hello.png")
		}
		
	@keyframes mooving {
		0% {left:0px;}
		50% {left:80vw;}
		100% {left:0px;}
		}
		
	@keyframes spinnin {
		0% {transform: rotate(0deg);}
		50% {transform:rotate(180deg);}
		100% {transform:rotate(360deg);}
		}
	
	div {
		max-width:30%;
		height: auto;
		content:url("hello.png");
		position: relative;
		animation: mooving 10s infinite;
		}
		
	div:hover {
		animation: mooving 10s infinite, spinnin 0.5s 1;
		}
	
</style>

<h1>JEZZA</h1>
</head>
<body>
<p>solve the puzzle for a little surprise...</p>
<img src="puzzle.png" style="width:500px;height:150px"></img>
<br>
<input type="text" oninput="func1()" id="puzzans" style="width:300px;height:50px;font-size:25px"></input>
<p id="op"></p>

<script>
	function func1() {
	  let x = document.getElementById("puzzans").value;
	  if (x=="131126") {
	  document.getElementById("op").innerHTML = x + " is correct!";}
	  else if (x=="13/11/26") {
	  document.getElementById("op").innerHTML = x + " is correct!";}
	  else if (x=="13 11 26") {
	  document.getElementById("op").innerHTML = x + " is correct!";}
	  else {
	  document.getElementById("op").innerHTML = "not quite!";}
	}
</script>
<div></div>

</body>
